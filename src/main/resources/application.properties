spring.application.name=clinic

# Web port: open http://localhost:8080 (other devices: http://<computer's IP>:8080).
server.port=${SERVER_PORT:8080}

# Other web addresses allowed to call the API (CORS), comma separated; ":[*]" means any port.
# The app itself never needs this (it is served from the same address).
app.cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*]

# Active profile: "dev" = real clinic_db, "demo" = clinic_demo filled with sample data on first start.
# Switch by changing this one line (the environment variable SPRING_PROFILES_ACTIVE also overrides it).
spring.profiles.active=dev

# Database credentials (the database name comes from application-<profile>.properties)
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Plan every query for its actual values: reports over date ranges stay fast (a cached generic plan was ~4x slower).
spring.datasource.hikari.connection-init-sql=SET plan_cache_mode = force_custom_plan

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Kolkata}
spring.flyway.enabled=true

# Uploads (logo). Files live on disk (folder set per profile), only the relative path is stored in the database.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# First-start administrator (created only when no users exist)
app.bootstrap.admin-username=${APP_ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:Admin@123}

# Stay signed in until "Sign out": a signed cookie restores the login after the session times out or the server restarts.
# Set APP_REMEMBER_ME_KEY to a long random secret on the clinic's server (changing it signs everyone out).
app.security.remember-me-key=${APP_REMEMBER_ME_KEY:clinic-remember-me-change-this-secret}
app.security.remember-me-days=3650

# Session & errors
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never

